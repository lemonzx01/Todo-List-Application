<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="แอปจัดการรายการสิ่งที่ต้องทำ (Todo List)" />
    <!-- สีแถบเบราว์เซอร์บนมือถือ ให้ตรงกับพื้นหลังของแอป (src/hooks/useTheme.ts เปลี่ยนค่านี้ตอนสลับโหมด) -->
    <meta name="theme-color" content="#FFFFFF" />
    <!-- ใส่โหมดมืดที่ผู้ใช้เคยเลือกไว้ก่อนหน้าเว็บจะแสดง จะได้ไม่เห็นพื้นขาวกะพริบก่อนเปลี่ยนเป็นมืด -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch {
        /* เบราว์เซอร์บางแบบไม่ให้ใช้ localStorage ก็ใช้โหมดสว่างไป */
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Todo List</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
